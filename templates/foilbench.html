<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoilBench · 烫箔印样检查</title>
<link rel="stylesheet" href="{{ url_for('static', filename='foil.css') }}">
<script defer src="{{ url_for('static', filename='foil.js') }}"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="/" aria-label="FoilBench 首页"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>FoilBench</a>
  <div class="bar-links"><span>印样检查</span><a id="prepare" href="/prepare">照片准备 ↗</a></div>
  <button id="demo" class="quiet">载入合成练习</button>
  <button id="open-import" class="gold">＋ 导入印样</button>
</header>
<main>
  <section class="workspace">
    <div class="lead">
      <div><p class="kicker">印样工作台</p><h1 id="title">选一份烫箔印样</h1><p id="metadata" class="muted">同尺寸版图和方向光照片</p></div>
      <p id="status" role="status" aria-live="polite">可先载入一份练习印样。</p>
    </div>
    <nav id="library" class="library" aria-label="印样列表"></nav>
    <div id="desk" class="desk" hidden>
      <section class="plate">
        <div class="plate-bar">
          <div class="switches" aria-label="方向灯" id="lights"><button data-light="a">灯 A</button><button data-light="b">灯 B</button></div>
          <div class="switches" aria-label="图像层" id="views"><button data-view="marked">检图</button><button data-view="photo">照片</button><button data-view="design">版图</button></div>
          <a id="source" download>下载照片</a>
        </div>
        <div class="stage">
          <canvas id="map" aria-label="印样源坐标图"></canvas>
        </div>
        <div class="plate-footer">
          <div class="tools" aria-label="图上工具">
            <button data-tool="point">读单点</button><button data-tool="inspect">画检查窗</button><button data-tool="gold">圈箔色</button><button data-tool="paper">圈纸色</button><button data-tool="line">画剖线</button>
          </div>
          <p id="map-note" aria-live="polite">点图面可读源照片像素。</p>
          <div id="point-panel" class="point-panel" hidden>
            <div class="point-head"><strong id="point-title">源像素</strong><span id="point-verdict" class="verdict"></span></div>
            <table><thead><tr><th>方向灯</th><th>RGB</th><th>箔色</th><th>单灯判定</th></tr></thead><tbody id="point-rows"></tbody></table>
          </div>
        </div>
      </section>
      <aside class="side">
        <section class="controls">
          <h2>检查设置</h2>
          <label>箔色门槛 <input id="threshold" type="number" min="-255" max="255" step="0.5"></label>
          <label>毫米每像素 <input id="mm_per_pixel" type="number" min="0.001" max="100" step="0.001"></label>
          <label>最小斑块像素数 <input id="min_pixels" type="number" min="1" max="4000000" step="1"></label>
          <button id="retain-settings" class="outline">保留设置</button>
        </section>
        <section class="history"><h2>检查存档</h2><div id="archive"></div></section>
      </aside>
    </div>
    <section id="result" hidden>
      <div id="modes" class="modes" aria-label="检查项目"></div>
      <div class="result-head"><div><h2 id="result-heading">转移覆盖</h2><p id="result-note" class="muted"></p></div><div class="actions"><button id="save" class="gold">保存检查</button><button id="return-current" class="outline" hidden>返回当前检查</button></div></div>
      <div id="exports" class="exports" hidden><a id="csv" download>下载 CSV</a><a id="overlay" download>下载标记图</a></div>
      <div class="table-wrap"><table><thead id="columns"></thead><tbody id="rows"></tbody></table><p id="empty-rows" hidden>检查窗内没有符合设置的记录。</p></div>
    </section>
    <section id="empty" class="empty"><div class="empty-chip" aria-hidden="true"></div><h2>检查烫箔转移和纸面留白</h2><p>导入白字黑底版图与灯 A 照片。等尺寸的灯 B 照片可一同导入。</p></section>
  </section>
</main>
<dialog id="import-dialog">
  <form id="import-form">
    <h2>导入烫箔印样</h2>
    <label>印样名称 <input name="title" maxlength="160"></label>
    <label>白字黑底版图 <input name="design" type="file" accept="image/png,image/jpeg" required></label>
    <label>灯 A 照片 <input name="a" type="file" accept="image/png,image/jpeg" required></label>
    <label>灯 B 照片（可选） <input name="b" type="file" accept="image/png,image/jpeg"></label>
    <p>使用已对齐且像素宽高一致的 PNG 或 JPEG。</p>
    <p id="import-error" aria-live="polite"></p>
    <div class="actions"><button id="close-import" type="button" class="quiet">取消</button><button class="gold">导入印样</button></div>
  </form>
</dialog>
</body>
</html>
