name: solo89-foilbench
services:
  desk:
    build:
      context: .
      args:
        FOILBENCH_RUNTIME_IMAGE: ${FOILBENCH_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${FOILBENCH_IMAGE:-solo89-foilbench:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${FOILBENCH_PORT:-19889}:8000"
    volumes:
      - foil-data:/var/lib/foilbench
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/foil/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  foil-data:
